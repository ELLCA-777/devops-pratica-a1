name: CI - Validacao do projeto

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build e testes automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar build
        run: npm run build

      - name: Executar testes unitarios
        run: npm test

      - name: Executar testes de integracao
        run: npm run test:integration

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: projeto-build
          path: dist/
          retention-days: 7